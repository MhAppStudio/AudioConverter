<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musik Erstellen - AI Music Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #262626;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #404040;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(255,255,255,0.1); }
            50% { box-shadow: 0 0 30px rgba(255,255,255,0.25); }
        }
        .animate-glow {
            animation: pulseGlow 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-black text-white font-sans antialiased min-h-screen flex flex-col selection:bg-white selection:text-black">

    <header class="border-b border-neutral-900 bg-black/80 backdrop-blur sticky top-0 z-40 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-white text-black flex items-center justify-center font-bold text-lg shadow-lg">
                <i class="fa-solid fa-music"></i>
            </div>
            <h1 class="text-lg font-bold tracking-tight">AudioCraft AI</h1>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="openLibrary()" class="text-xs bg-neutral-900 hover:bg-neutral-800 text-neutral-300 px-3 py-2 rounded-full border border-neutral-800 transition flex items-center space-x-2">
                <i class="fa-solid fa-compact-disc"></i>
                <span>Meine Tracks</span>
            </button>
            <div class="w-8 h-8 rounded-full bg-neutral-800 flex items-center justify-center text-xs font-semibold text-neutral-300">
                AI
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-2xl w-full mx-auto p-4 md:p-6 flex flex-col justify-between">
        
        <!-- Top Section Container -->
        <div class="flex-1 flex flex-col space-y-5">
            
            <!-- Mode Switcher -->
            <div class="bg-neutral-900 p-1.5 rounded-full flex border border-neutral-800">
                <button id="btnDescMode" onclick="switchMode('desc')" class="flex-1 py-2.5 px-4 rounded-full text-sm font-medium text-neutral-400 hover:text-white transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-align-left text-xs"></i>
                    <span>Songbeschreibung</span>
                </button>
                <button id="btnLyricsMode" onclick="switchMode('lyrics')" class="flex-1 py-2.5 px-4 rounded-full text-sm font-bold bg-white text-black shadow-md transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-pen-nib text-xs"></i>
                    <span>Songtext-Modus</span>
                </button>
            </div>

            <!-- Dynamic Input Container -->
            <div id="inputContainer" class="bg-neutral-900 rounded-2xl p-5 border border-neutral-800 flex flex-col flex-1 min-h-[280px] shadow-xl">
                <!-- Lyrics Mode Content -->
                <div id="lyricsContentView" class="flex flex-col flex-1">
                    <textarea id="lyricsInput" class="w-full bg-transparent resize-none focus:outline-none text-neutral-300 text-base leading-relaxed flex-1 font-mono" placeholder="Gib hier deinen Songtext ein...">[Strophe]
Ich laufe durch die Straßen, verloren in der Stadt,
suche nach den Worten, die die Nacht uns gegeben hat.
[Refrain]
Elektrischer Puls, die Bässe schlagen hart,
wir reiten auf dem Rhythmus in eine neue Fahrt!</textarea>
                </div>

                <!-- Description Mode Content (Hidden by default) -->
                <div id="descContentView" class="hidden flex flex-col flex-1">
                    <textarea id="descInput" class="w-full bg-transparent resize-none focus:outline-none text-neutral-300 text-base leading-relaxed flex-1" placeholder="Beschreibe deinen Song... Z.B.: Ein energetischer Synthwave-Track über eine nächtliche Autofahrt durch Berlin mit treibenden Drums und atmosphärischen Pads."></textarea>
                </div>

                <!-- Settings Button inside card -->
                <div class="pt-4 border-t border-neutral-800/60 mt-3 flex items-center justify-between">
                    <button onclick="openSettings()" class="bg-neutral-800 hover:bg-neutral-700 text-white px-4 py-2.5 rounded-full text-sm font-medium transition flex items-center space-x-2 border border-neutral-700">
                        <i class="fa-solid fa-sliders text-xs text-neutral-400"></i>
                        <span>Einstellungen</span>
                    </button>
                    <div id="activeSettingsBadge" class="text-xs text-neutral-400 hidden bg-neutral-800/80 px-3 py-1 rounded-full border border-neutral-700">
                        Pop • Männlich
                    </div>
                </div>
            </div>

            <!-- Tags Section -->
            <div>
                <p class="text-xs text-neutral-400 mb-2 font-medium px-1">Stimmung & Inspiration</p>
                <div class="flex flex-wrap gap-2" id="tagContainer">
                    <button onclick="toggleTag(this)" class="tag-btn bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 text-neutral-300 text-xs px-3.5 py-2 rounded-full transition flex items-center space-x-1.5 active">
                        <span>✨ Vorschlagen</span>
                    </button>
                    <button onclick="toggleTag(this)" class="tag-btn bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 text-neutral-300 text-xs px-3.5 py-2 rounded-full transition">
                        <span>🔥 Energetisch</span>
                    </button>
                    <button onclick="toggleTag(this)" class="tag-btn bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 text-neutral-300 text-xs px-3.5 py-2 rounded-full transition">
                        <span>😂 Lustig</span>
                    </button>
                    <button onclick="toggleTag(this)" class="tag-btn bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 text-neutral-300 text-xs px-3.5 py-2 rounded-full transition">
                        <span>🌟 Glücklich</span>
                    </button>
                    <button onclick="toggleTag(this)" class="tag-btn bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 text-neutral-300 text-xs px-3.5 py-2 rounded-full transition">
                        <span>☕ Entspannt</span>
                    </button>
                </div>
            </div>

        </div>

        <!-- Bottom Generate Button -->
        <div class="pt-6">
            <button onclick="generateMusic()" class="w-full py-4 bg-white hover:bg-neutral-200 text-black font-bold rounded-full shadow-lg transition flex items-center justify-center space-x-2 text-base animate-glow">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span>Erstellen</span>
            </button>
        </div>

    </main>

    <div id="settingsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-end justify-center hidden transition-opacity opacity-0" onclick="if(event.target === this) closeSettings()">
        <div id="settingsSheet" class="bg-neutral-950 w-full max-w-lg rounded-t-3xl p-6 border-t border-neutral-800 transform translate-y-full transition-transform duration-300 max-h-[85vh] overflow-y-auto">
            <div class="w-12 h-1.5 bg-neutral-700 rounded-full mx-auto mb-5"></div>
            
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-lg font-bold">Einstellungen</h3>
                <button onclick="closeSettings()" class="text-neutral-400 hover:text-white p-2">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Genre Selection -->
            <div class="mb-6">
                <label class="block text-sm font-semibold text-neutral-300 mb-3">Genre auswählen (Optional)</label>
                <div class="grid grid-cols-4 gap-2.5">
                    <button onclick="selectGenre('Pop', this)" class="genre-card p-3 rounded-xl bg-neutral-900 border border-neutral-800 hover:border-white transition flex flex-col items-center justify-center space-y-1 text-center selected-genre border-white">
                        <span class="text-xl">🎵</span>
                        <span class="text-xs font-medium">Pop</span>
                    </button>
                    <button onclick="selectGenre('Rock', this)" class="genre-card p-3 rounded-xl bg-neutral-900 border border-neutral-800 hover:border-white transition flex flex-col items-center justify-center space-y-1 text-center">
                        <span class="text-xl">🎸</span>
                        <span class="text-xs font-medium">Rock</span>
                    </button>
                    <button onclick="selectGenre('Klassik', this)" class="genre-card p-3 rounded-xl bg-neutral-900 border border-neutral-800 hover:border-white transition flex flex-col items-center justify-center space-y-1 text-center">
                        <span class="text-xl">🎹</span>
                        <span class="text-xs font-medium">Klassik</span>
                    </button>
                    <button onclick="selectGenre('Jazz', this)" class="genre-card p-3 rounded-xl bg-neutral-900 border border-neutral-800 hover:border-white transition flex flex-col items-center justify-center space-y-1 text-center">
                        <span class="text-xl">🎷</span>
                        <span class="text-xs font-medium">Jazz</span>
                    </button>
                </div>
            </div>

            <!-- Title Input -->
            <div class="mb-6">
                <label class="block text-sm font-semibold text-neutral-300 mb-2">Titel (Optional)</label>
                <input type="text" id="songTitleInput" placeholder="Gib deinen Titel ein" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-neutral-600 transition">
            </div>

            <!-- Voice Selection -->
            <div class="mb-8">
                <label class="block text-sm font-semibold text-neutral-300 mb-3">Stimme auswählen (Optional)</label>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="selectVoice('Männlich', this)" id="voiceMaleBtn" class="voice-btn py-3 px-4 rounded-xl bg-white text-black font-semibold text-sm transition flex items-center justify-center space-x-2 shadow">
                        <i class="fa-solid fa-mars"></i>
                        <span>Männlich</span>
                    </button>
                    <button onclick="selectVoice('Weiblich', this)" id="voiceFemaleBtn" class="voice-btn py-3 px-4 rounded-xl bg-neutral-900 border border-neutral-800 text-neutral-300 font-semibold text-sm transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-venus"></i>
                        <span>Weiblich</span>
                    </button>
                </div>
            </div>

            <!-- Apply Button -->
            <button onclick="closeSettings()" class="w-full py-3.5 bg-white text-black font-bold rounded-xl hover:bg-neutral-200 transition shadow-lg text-sm">
                Anwenden
            </button>
        </div>
    </div>

    <div id="loadingModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center hidden">
        <div class="bg-neutral-900 border border-neutral-800 p-8 rounded-3xl max-w-sm w-full mx-4 text-center shadow-2xl flex flex-col items-center">
            <div class="w-16 h-16 rounded-full bg-neutral-800 flex items-center justify-center text-white mb-5 animate-spin">
                <i class="fa-solid fa-compact-disc text-2xl"></i>
            </div>
            <h3 class="text-lg font-bold mb-2" id="loadingTitle">Generiere Song...</h3>
            <p class="text-xs text-neutral-400 mb-6" id="loadingSubtitle">Künstliche Intelligenz komponiert Melodie & Gesang</p>
            <div class="w-full bg-neutral-800 h-2 rounded-full overflow-hidden mb-4">
                <div id="progressBar" class="bg-white h-full w-0 transition-all duration-300"></div>
            </div>
            <span id="progressText" class="text-xs font-mono text-neutral-400">0%</span>
        </div>
    </div>

    <div id="playerModal" class="fixed inset-0 bg-black/90 backdrop-blur-lg z-50 flex items-center justify-center hidden p-4">
        <div class="bg-neutral-900 border border-neutral-800 p-6 md:p-8 rounded-3xl max-w-md w-full text-center shadow-2xl relative">
            <button onclick="closePlayer()" class="absolute top-4 right-4 text-neutral-400 hover:text-white p-2">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            
            <div class="w-24 h-24 mx-auto rounded-2xl bg-gradient-to-tr from-purple-900 to-indigo-600 flex items-center justify-center text-white text-4xl mb-5 shadow-xl animate-pulse">
                <i class="fa-solid fa-music"></i>
            </div>

            <h3 id="playerSongTitle" class="text-xl font-bold mb-1">Neon Nächte</h3>
            <p id="playerSongMeta" class="text-xs text-neutral-400 mb-6">Pop • Männliche Stimme • 120 BPM</p>

            <!-- Visualizer simulation -->
            <div class="flex items-center justify-center space-x-1 h-12 mb-6 bg-neutral-950/60 rounded-2xl p-3 border border-neutral-800">
                <div class="w-1 bg-white h-4 rounded-full animate-bounce"></div>
                <div class="w-1 bg-white h-8 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                <div class="w-1 bg-white h-6 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                <div class="w-1 bg-white h-10 rounded-full animate-bounce" style="animation-delay: 0.3s"></div>
                <div class="w-1 bg-white h-5 rounded-full animate-bounce" style="animation-delay: 0.15s"></div>
                <div class="w-1 bg-white h-7 rounded-full animate-bounce" style="animation-delay: 0.25s"></div>
                <div class="w-1 bg-white h-9 rounded-full animate-bounce" style="animation-delay: 0.05s"></div>
                <div class="w-1 bg-white h-4 rounded-full animate-bounce" style="animation-delay: 0.35s"></div>
            </div>

            <!-- Player Controls -->
            <div class="flex items-center justify-center space-x-6 mb-6">
                <button onclick="togglePlay()" id="playPauseBtn" class="w-14 h-14 rounded-full bg-white text-black flex items-center justify-center text-xl hover:scale-105 transition shadow-lg">
                    <i id="playIcon" class="fa-solid fa-play ml-0.5"></i>
                </button>
            </div>

            <div class="flex space-x-3">
                <button onclick="downloadTrack()" class="flex-1 py-3 bg-neutral-800 hover:bg-neutral-700 text-white rounded-xl text-sm font-medium transition flex items-center justify-center space-x-2 border border-neutral-700">
                    <i class="fa-solid fa-download text-xs"></i>
                    <span>Herunterladen</span>
                </button>
                <button onclick="closePlayer()" class="flex-1 py-3 bg-white hover:bg-neutral-200 text-black rounded-xl text-sm font-bold transition">
                    Fertig
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'lyrics';
        let selectedGenre = 'Pop';
        let selectedVoice = 'Männlich';
        let isPlaying = false;
        let audioContext = null;

        function switchMode(mode) {
            currentMode = mode;
            const btnDesc = document.getElementById('btnDescMode');
            const btnLyrics = document.getElementById('btnLyricsMode');
            const lyricsView = document.getElementById('lyricsContentView');
            const descView = document.getElementById('descContentView');

            if (mode === 'desc') {
                btnDesc.className = 'flex-1 py-2.5 px-4 rounded-full text-sm font-bold bg-white text-black shadow-md transition flex items-center justify-center space-x-2';
                btnLyrics.className = 'flex-1 py-2.5 px-4 rounded-full text-sm font-medium text-neutral-400 hover:text-white transition flex items-center justify-center space-x-2';
                lyricsView.classList.add('hidden');
                descView.classList.remove('hidden');
            } else {
                btnLyrics.className = 'flex-1 py-2.5 px-4 rounded-full text-sm font-bold bg-white text-black shadow-md transition flex items-center justify-center space-x-2';
                btnDesc.className = 'flex-1 py-2.5 px-4 rounded-full text-sm font-medium text-neutral-400 hover:text-white transition flex items-center justify-center space-x-2';
                descView.classList.add('hidden');
                lyricsView.classList.remove('hidden');
            }
        }

        function toggleTag(btn) {
            document.querySelectorAll('.tag-btn').forEach(b => {
                b.classList.remove('bg-white', 'text-black', 'border-white', 'font-semibold');
                b.classList.add('bg-neutral-900', 'text-neutral-300', 'border-neutral-800');
            });
            btn.classList.remove('bg-neutral-900', 'text-neutral-300', 'border-neutral-800');
            btn.classList.add('bg-white', 'text-black', 'border-white', 'font-semibold');
        }

        function openSettings() {
            const modal = document.getElementById('settingsModal');
            const sheet = document.getElementById('settingsSheet');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                sheet.classList.remove('translate-y-full');
            }, 10);
        }

        function closeSettings() {
            const modal = document.getElementById('settingsModal');
            const sheet = document.getElementById('settingsSheet');
            sheet.classList.add('translate-y-full');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                updateActiveSettingsBadge();
            }, 300);
        }

        function selectGenre(genre, btn) {
            selectedGenre = genre;
            document.querySelectorAll('.genre-card').forEach(c => {
                c.classList.remove('border-white', 'bg-neutral-800');
                c.classList.add('border-neutral-800');
            });
            btn.classList.remove('border-neutral-800');
            btn.classList.add('border-white', 'bg-neutral-800/50');
        }

        function selectVoice(voice, btn) {
            selectedVoice = voice;
            const maleBtn = document.getElementById('voiceMaleBtn');
            const femaleBtn = document.getElementById('voiceFemaleBtn');

            if (voice === 'Männlich') {
                maleBtn.className = 'voice-btn py-3 px-4 rounded-xl bg-white text-black font-semibold text-sm transition flex items-center justify-center space-x-2 shadow';
                femaleBtn.className = 'voice-btn py-3 px-4 rounded-xl bg-neutral-900 border border-neutral-800 text-neutral-300 font-semibold text-sm transition flex items-center justify-center space-x-2';
            } else {
                femaleBtn.className = 'voice-btn py-3 px-4 rounded-xl bg-white text-black font-semibold text-sm transition flex items-center justify-center space-x-2 shadow';
                maleBtn.className = 'voice-btn py-3 px-4 rounded-xl bg-neutral-900 border border-neutral-800 text-neutral-300 font-semibold text-sm transition flex items-center justify-center space-x-2';
            }
        }

        function updateActiveSettingsBadge() {
            const badge = document.getElementById('activeSettingsBadge');
            badge.textContent = `${selectedGenre} • ${selectedVoice}e Stimme`;
            badge.classList.remove('hidden');
        }

        function generateMusic() {
            const loadingModal = document.getElementById('loadingModal');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            
            loadingModal.classList.remove('hidden');
            progressBar.style.width = '0%';
            progressText.textContent = '0%';

            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 12) + 5;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    setTimeout(() => {
                        loadingModal.classList.add('hidden');
                        openPlayerModal();
                    }, 400);
                }
                progressBar.style.width = progress + '%';
                progressText.textContent = progress + '%';
            }, 250);
        }

        function openPlayerModal() {
            const playerModal = document.getElementById('playerModal');
            const titleInput = document.getElementById('songTitleInput').value.trim();
            const songTitle = document.getElementById('playerSongTitle');
            const songMeta = document.getElementById('playerSongMeta');

            songTitle.textContent = titleInput !== '' ? titleInput : 'Neon Nächte (AI Master)';
            songMeta.textContent = `${selectedGenre} • ${selectedVoice}e Stimme • 128 BPM`;
            playerModal.classList.remove('hidden');
        }

        function closePlayer() {
            document.getElementById('playerModal').classList.add('hidden');
            if (isPlaying) togglePlay();
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            const icon = document.getElementById('playIcon');
            if (isPlaying) {
                icon.className = 'fa-solid fa-pause';
                playSynthBeep();
            } else {
                icon.className = 'fa-solid fa-play ml-0.5';
            }
        }

        function playSynthBeep() {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioContext.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioContext.currentTime + 0.5);
                gain.gain.setValueAtTime(0.1, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.start();
                osc.stop(audioContext.currentTime + 0.5);
            } catch(e) {
                console.log('Audio Context not allowed yet');
            }
        }

        function downloadTrack() {
            // Simulated download
            const blob = new Blob(["Simulated Audio Data for Music Track"], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'AudioCraft_Track.mp3';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function openLibrary() {
            alert('Deine Bibliothek ist aktuell noch leer. Erstelle deinen ersten Song!');
        }
    </script>
</body>
</html>
