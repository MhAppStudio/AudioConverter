<!DOCTYPE html>
<html lang="de" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AudioForge & iMusic Studio Suite</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- lamejs for high-efficiency MP3 encoding -->
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
  <!-- Google Font Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            ios: {
              bg: '#000000',
              card: '#1c1c1e',
              cardHover: '#2c2c2e',
              blue: '#0a84ff',
              indigo: '#5e5ce6',
              purple: '#bf5af2',
              green: '#30d158',
              red: '#ff453a',
              orange: '#ff9f0a',
              pink: '#FA233B',
              textMuted: '#8e8e93'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 22px;
      width: 22px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      cursor: pointer;
      margin-top: -9px;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: #3a3a3c;
      border-radius: 2px;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #3a3a3c; border-radius: 4px; }
    .glass-panel {
      background: rgba(28, 28, 30, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start max-w-xl mx-auto px-3 sm:px-6 pb-24 pt-3">

  <!-- Master Navigation Header -->
  <header id="master-header" class="w-full bg-ios-card p-1.5 rounded-2xl mb-4 hidden border border-white/10 shadow-xl z-30 grid grid-cols-4 gap-1">
    <button onclick="switchApp('welcome')" id="nav-btn-welcome" type="button" class="py-2.5 px-2 rounded-xl text-xs font-bold text-ios-textMuted hover:text-white transition-all cursor-pointer flex items-center justify-center">
      <i class="fa-solid fa-house text-sm"></i>
    </button>
    <button onclick="switchApp('converter')" id="nav-btn-converter" type="button" class="py-2.5 px-2 rounded-xl text-xs font-bold text-ios-textMuted hover:text-white transition-all cursor-pointer flex items-center justify-center gap-1">
      <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
      <span class="truncate">Converter</span>
    </button>
    <button onclick="switchApp('aimusic')" id="nav-btn-aimusic" type="button" class="py-2.5 px-2 rounded-xl text-xs font-bold text-white bg-ios-blue shadow transition-all cursor-pointer flex items-center justify-center gap-1">
      <i class="fa-solid fa-robot text-xs"></i>
      <span class="truncate">KI-Musik</span>
    </button>
    <button onclick="switchApp('imusic')" id="nav-btn-imusic" type="button" class="py-2.5 px-2 rounded-xl text-xs font-bold text-ios-textMuted hover:text-white transition-all cursor-pointer flex items-center justify-center gap-1">
      <i class="fa-solid fa-music text-xs"></i>
      <span class="truncate">Bibliothek</span>
    </button>
  </header>

  <!-- ==================== WELCOME SCREEN ==================== -->
  <div id="app-welcome" class="w-full flex flex-col items-center pt-10 pb-12">
    <div class="w-24 h-24 rounded-3xl bg-gradient-to-tr from-purple-600 via-indigo-600 to-pink-600 flex items-center justify-center shadow-2xl mb-6 border border-white/20">
      <i class="fa-solid fa-wand-magic-sparkles text-4xl text-white"></i>
    </div>
    
    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-center text-white mb-2">
      AudioForge & KI Studio
    </h1>
    <p class="text-xs sm:text-sm text-ios-textMuted text-center max-w-sm mb-8">
      Erstelle Songs mit KI-Stimmen, Lyrics und eigenen Einstellungen.
    </p>

    <div class="w-full space-y-3.5 mb-8">
      <div onclick="switchApp('aimusic')" class="w-full bg-ios-card hover:bg-ios-cardHover active:scale-[0.98] transition-all rounded-3xl p-5 border border-white/10 shadow-xl cursor-pointer flex items-center justify-between group">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-2xl bg-ios-purple/20 text-ios-purple flex items-center justify-center text-lg">
            <i class="fa-solid fa-robot"></i>
          </div>
          <div>
            <h3 class="text-sm font-bold text-white mb-0.5">KI-Musik Studio öffnen</h3>
            <p class="text-xs text-ios-textMuted">Songbeschreibung, Songtexte & Einstellungen</p>
          </div>
        </div>
        <div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-slate-400 group-hover:text-white">
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== APP: AI MUSIC CREATOR (Neu nach Screenshots) ==================== -->
  <div id="app-aimusic" class="w-full flex flex-col hidden space-y-4">
    <div class="flex items-center justify-between mb-1 pt-1">
      <h1 class="text-xl font-bold text-white">Musik erstellen</h1>
    </div>

    <!-- Modus Umschalter (Songbeschreibung / Songtext-Modus) -->
    <div class="w-full bg-ios-card p-1 rounded-2xl flex border border-white/10 shadow-md">
      <button id="mode-desc-btn" type="button" onclick="switchAiMode('desc')" class="flex-1 py-2 rounded-xl text-xs font-semibold text-ios-textMuted transition cursor-pointer flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-align-left text-xs"></i> Songbeschreibung
      </button>
      <button id="mode-lyrics-btn" type="button" onclick="switchAiMode('lyrics')" class="flex-1 py-2 rounded-xl text-xs font-semibold text-white bg-white/10 shadow transition cursor-pointer flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-pen-nib text-xs"></i> Songtext-Modus
      </button>
    </div>

    <!-- Eingabe-Bereich (Dynamisch je nach Modus) -->
    <div class="w-full bg-ios-card rounded-3xl p-4 shadow-2xl border border-white/5 space-y-3">
      <!-- Songbeschreibung Textarea (Standard versteckt) -->
      <div id="desc-container" class="hidden">
        <textarea id="ai-desc-input" rows="4" placeholder="Beschreibe den Song, den du erstellen möchtest (z.B. Ein fröhlicher Sommer-Pop-Song über Freiheit)..." class="w-full bg-ios-cardHover text-white text-xs rounded-2xl p-3 border border-white/10 focus:outline-none resize-none"></textarea>
      </div>

      <!-- Songtext-Modus Textarea -->
      <div id="lyrics-container" class="space-y-2">
        <textarea id="ai-lyrics-input" rows="6" class="w-full bg-ios-cardHover text-white text-xs rounded-2xl p-3 border border-white/10 focus:outline-none resize-none leading-relaxed">[Strophe]
Ich laufe durch die Straßen, verloren in der Stadt
Kein Plan, kein Ziel, suche nur nach etwas Schönem
Überfüllte Gehwege, Neonlichter über mir
Menschen ziehen vorbei, doch keiner sieht mein Band

[Strophe 2]
Hohe Gebäude ragen in den Mitternachtshimmel
Gesichter blicken herab, doch niema...</textarea>
      </div>

      <!-- Einstellungen Button -->
      <button type="button" onclick="openSettingsModal()" class="py-2 px-3.5 rounded-full bg-white/10 hover:bg-white/20 text-white text-xs font-medium flex items-center gap-2 cursor-pointer transition">
        <i class="fa-solid fa-wand-magic-sparkles text-ios-purple"></i> Einstellungen
      </button>
    </div>

    <!-- Vibe / Stimmung Schnell-Tags -->
    <div class="flex space-x-2 overflow-x-auto no-scrollbar py-1">
      <button onclick="addVibeTag('Lustig')" class="px-3.5 py-1.5 rounded-full text-xs font-semibold bg-white/10 hover:bg-white/20 text-slate-300 transition whitespace-nowrap">Lustig</button>
      <button onclick="addVibeTag('Glücklich')" class="px-3.5 py-1.5 rounded-full text-xs font-semibold bg-white/10 hover:bg-white/20 text-slate-300 transition whitespace-nowrap">Glücklich</button>
      <button onclick="addVibeTag('Entspannt')" class="px-3.5 py-1.5 rounded-full text-xs font-semibold bg-white/10 hover:bg-white/20 text-slate-300 transition whitespace-nowrap">Entspannt</button>
      <button onclick="addVibeTag('Energetisch')" class="px-3.5 py-1.5 rounded-full text-xs font-semibold bg-white/10 hover:bg-white/20 text-slate-300 transition whitespace-nowrap">Energetisch</button>
    </div>

    <!-- Erstellen Button -->
    <button id="ai-generate-btn" type="button" onclick="generateAiMusic()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold text-sm shadow-xl active:scale-[0.98] transition cursor-pointer flex items-center justify-center gap-2">
      <i class="fa-solid fa-music"></i> Erstellen
    </button>

    <!-- Ergebnis Box -->
    <div id="ai-result-box" class="hidden w-full bg-ios-card rounded-3xl p-4 shadow-2xl border border-purple-500/30 space-y-3">
      <h3 id="ai-result-title" class="text-sm font-bold text-white">Dein Song ist bereit</h3>
      <audio id="ai-audio-player" controls class="w-full"></audio>
      <button onclick="sendAiSongToImusic()" class="w-full py-2.5 rounded-xl bg-pink-600 text-white text-xs font-bold">Zu iMusic hinzufügen</button>
    </div>
  </div>

  <!-- ==================== EINSTELLUNGEN MODAL (Nach Screenshot 1) ==================== -->
  <div id="settings-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-end sm:items-center justify-center sm:p-5">
    <div class="glass-panel w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-5 border border-white/10 space-y-5 max-h-[85vh] overflow-y-auto custom-scrollbar">
      
      <div class="flex justify-between items-center border-b border-white/10 pb-3">
        <h3 class="text-base font-bold text-white">Einstellungen</h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-white text-sm w-7 h-7 rounded-full bg-white/10 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <!-- Genre auswählen -->
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-300">Genre auswählen <span class="text-slate-500">(Optional)</span></label>
        <div class="grid grid-cols-5 gap-2 text-center">
          <div onclick="selectGenre('Klassik')" class="genre-item cursor-pointer space-y-1 group">
            <div class="w-14 h-14 rounded-full overflow-hidden border-2 border-transparent group-hover:border-ios-blue transition mx-auto bg-slate-800 flex items-center justify-center text-xs">🎹</div>
            <span class="text-[10px] text-slate-300 block">Klassik</span>
          </div>
          <div onclick="selectGenre('Country')" class="genre-item cursor-pointer space-y-1 group">
            <div class="w-14 h-14 rounded-full overflow-hidden border-2 border-transparent group-hover:border-ios-blue transition mx-auto bg-slate-800 flex items-center justify-center text-xs">🤠</div>
            <span class="text-[10px] text-slate-300 block">Country</span>
          </div>
          <div onclick="selectGenre('Pop')" class="genre-item cursor-pointer space-y-1 group">
            <div class="w-14 h-14 rounded-full overflow-hidden border-2 border-transparent group-hover:border-ios-blue transition mx-auto bg-slate-800 flex items-center justify-center text-xs">💿</div>
            <span class="text-[10px] text-slate-300 block">Pop</span>
          </div>
          <div onclick="selectGenre('Jazz')" class="genre-item cursor-pointer space-y-1 group">
            <div class="w-14 h-14 rounded-full overflow-hidden border-2 border-transparent group-hover:border-ios-blue transition mx-auto bg-slate-800 flex items-center justify-center text-xs">🎷</div>
            <span class="text-[10px] text-slate-300 block">Jazz</span>
          </div>
          <div onclick="selectGenre('Rock')" class="genre-item cursor-pointer space-y-1 group">
            <div class="w-14 h-14 rounded-full overflow-hidden border-2 border-transparent group-hover:border-ios-blue transition mx-auto bg-slate-800 flex items-center justify-center text-xs">🎸</div>
            <span class="text-[10px] text-slate-300 block">Rock</span>
          </div>
        </div>
      </div>

      <!-- Titel -->
      <div class="space-y-1">
        <label class="block text-xs font-semibold text-slate-300">Titel <span class="text-slate-500">(Optional)</span></label>
        <input type="text" id="modal-song-title" placeholder="Gib deinen Titel ein" class="w-full bg-ios-cardHover text-white text-xs rounded-xl p-3 border border-white/10 focus:outline-none focus:border-ios-blue">
      </div>

      <!-- Stimme auswählen -->
      <div class="space-y-1.5">
        <label class="block text-xs font-semibold text-slate-300">Stimme auswählen <span class="text-slate-500">(Optional)</span></label>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="selectVoice('Männlich')" id="voice-m" class="py-2.5 px-3 rounded-xl border border-white/10 bg-ios-cardHover text-slate-300 text-xs font-semibold text-left transition flex items-center justify-between">
            <span>Männlich</span>
            <span class="w-3.5 h-3.5 rounded-full border border-slate-500 inline-block"></span>
          </button>
          <button type="button" onclick="selectVoice('Weiblich')" id="voice-w" class="py-2.5 px-3 rounded-xl border border-white/10 bg-ios-cardHover text-slate-300 text-xs font-semibold text-left transition flex items-center justify-between">
            <span>Weiblich</span>
            <span class="w-3.5 h-3.5 rounded-full border border-slate-500 inline-block"></span>
          </button>
        </div>
      </div>

      <!-- Aufnahmeart auswählen -->
      <div class="space-y-1.5">
        <label class="block text-xs font-semibold text-slate-300">Aufnahmeart auswählen <span class="text-slate-500">(Optional)</span></label>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="selectRecordType('Studio')" id="rec-studio" class="py-2.5 px-3 rounded-xl border border-white/10 bg-ios-cardHover text-slate-300 text-xs font-semibold text-left transition flex items-center justify-between">
            <span>Studio</span>
            <span class="w-3.5 h-3.5 rounded-full border border-slate-500 inline-block"></span>
          </button>
          <button type="button" onclick="selectRecordType('Live')" id="rec-live" class="py-2.5 px-3 rounded-xl border border-white/10 bg-ios-cardHover text-slate-300 text-xs font-semibold text-left transition flex items-center justify-between">
            <span>Live (Konzert)</span>
            <span class="w-3.5 h-3.5 rounded-full border border-slate-500 inline-block"></span>
          </button>
        </div>
      </div>

      <!-- Anwenden Button -->
      <button onclick="closeSettingsModal()" class="w-full py-3.5 rounded-2xl bg-white text-black font-bold text-sm shadow-lg active:scale-[0.98] transition cursor-pointer">
        Anwenden
      </button>

    </div>
  </div>

  <!-- ==================== DUMMY APPS FÜR NAVIGATION ==================== -->
  <div id="app-converter" class="w-full hidden text-center py-12"><p class="text-xs text-slate-400">Converter Bereich</p></div>
  <div id="app-imusic" class="w-full hidden text-center py-12"><p class="text-xs text-slate-400">iMusic Bibliothek Bereich</p></div>

  <!-- JavaScript Logik -->
  <script>
    let activeAiMode = 'lyrics';
    let selectedGenre = '';
    let selectedVoice = '';
    let selectedRecordType = '';
    let generatedAiSongBlob = null;
    let generatedAiSongName = '';

    window.addEventListener('DOMContentLoaded', () => {
      switchApp('aimusic');
    });

    function switchApp(appName) {
      document.getElementById('app-welcome').classList.add('hidden');
      document.getElementById('app-aimusic').classList.add('hidden');
      document.getElementById('app-converter').classList.add('hidden');
      document.getElementById('app-imusic').classList.add('hidden');
      document.getElementById('master-header').classList.remove('hidden');

      if (appName === 'welcome') {
        document.getElementById('app-welcome').classList.remove('hidden');
        document.getElementById('master-header').classList.add('hidden');
      } else if (appName === 'aimusic') {
        document.getElementById('app-aimusic').classList.remove('hidden');
      } else if (appName === 'converter') {
        document.getElementById('app-converter').classList.remove('hidden');
      } else if (appName === 'imusic') {
        document.getElementById('app-imusic').classList.remove('hidden');
      }
    }

    function switchAiMode(mode) {
      activeAiMode = mode;
      const descBtn = document.getElementById('mode-desc-btn');
      const lyricsBtn = document.getElementById('mode-lyrics-btn');
      const descContainer = document.getElementById('desc-container');
      const lyricsContainer = document.getElementById('lyrics-container');

      if (mode === 'desc') {
        descBtn.className = "flex-1 py-2 rounded-xl text-xs font-semibold text-white bg-white/10 shadow transition cursor-pointer flex items-center justify-center gap-1.5";
        lyricsBtn.className = "flex-1 py-2 rounded-xl text-xs font-semibold text-ios-textMuted transition cursor-pointer flex items-center justify-center gap-1.5";
        descContainer.classList.remove('hidden');
        lyricsContainer.classList.add('hidden');
      } else {
        lyricsBtn.className = "flex-1 py-2 rounded-xl text-xs font-semibold text-white bg-white/10 shadow transition cursor-pointer flex items-center justify-center gap-1.5";
        descBtn.className = "flex-1 py-2 rounded-xl text-xs font-semibold text-ios-textMuted transition cursor-pointer flex items-center justify-center gap-1.5";
        lyricsContainer.classList.remove('hidden');
        descContainer.classList.add('hidden');
      }
    }

    function openSettingsModal() {
      document.getElementById('settings-modal').classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('settings-modal').classList.add('hidden');
    }

    function selectGenre(genre) {
      selectedGenre = genre;
      alert("Genre gewählt: " + genre);
    }

    function selectVoice(voice) {
      selectedVoice = voice;
      document.getElementById('voice-m').style.borderColor = voice === 'Männlich' ? '#0a84ff' : 'rgba(255,255,255,0.1)';
      document.getElementById('voice-w').style.borderColor = voice === 'Weiblich' ? '#0a84ff' : 'rgba(255,255,255,0.1)';
    }

    function selectRecordType(type) {
      selectedRecordType = type;
      document.getElementById('rec-studio').style.borderColor = type === 'Studio' ? '#0a84ff' : 'rgba(255,255,255,0.1)';
      document.getElementById('rec-live').style.borderColor = type === 'Live' ? '#0a84ff' : 'rgba(255,255,255,0.1)';
    }

    function addVibeTag(tag) {
      const input = activeAiMode === 'desc' ? document.getElementById('ai-desc-input') : document.getElementById('ai-lyrics-input');
      input.value += (input.value ? ' ' : '') + `[Vibe: ${tag}]`;
    }

    function generateAiMusic() {
      const title = document.getElementById('modal-song-title').value || "KI Song";
      
      // Erzeuge kurze Audio-Demo über Web Audio API
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const buffer = audioCtx.createBuffer(2, 44100 * 5, 44100);
      const data = buffer.getChannelData(0);
      for(let i=0; i<data.length; i++) data[i] = Math.sin(i / 100) * 0.3;
      
      generatedAiSongBlob = bufferToWavBlob(buffer);
      generatedAiSongName = title + ".wav";
      
      const url = URL.createObjectURL(generatedAiSongBlob);
      document.getElementById('ai-audio-player').src = url;
      document.getElementById('ai-result-title').textContent = title + " (" + (selectedGenre || "Pop") + ")";
      document.getElementById('ai-result-box').classList.remove('hidden');
    }

    function bufferToWavBlob(buffer) {
      const length = buffer.length * 4 + 44;
      const out = new DataView(new ArrayBuffer(length));
      let pos = 0;
      function writeStr(s) { for(let i=0; i<s.length; i++) out.setUint8(pos++, s.charCodeAt(i)); }
      writeStr('RIFF'); out.setUint32(pos, length - 8, true); pos += 4;
      writeStr('WAVE'); writeStr('fmt '); out.setUint32(pos, 16, true); pos += 4;
      out.setUint16(pos, 1, true); pos += 2; out.setUint16(pos, 2, true); pos += 2;
      out.setUint32(pos, 44100, true); pos += 4; out.setUint32(pos, 176400, true); pos += 4;
      out.setUint16(pos, 4, true); pos += 2; out.setUint16(pos, 16, true); pos += 2;
      writeStr('data'); out.setUint32(pos, length - pos - 4, true); pos += 4;
      return new Blob([out.buffer], { type: 'audio/wav' });
    }

    function sendAiSongToImusic() {
      alert("Song erfolgreich an iMusic übergeben!");
      switchApp('imusic');
    }
  </script>
</body>
</html>
