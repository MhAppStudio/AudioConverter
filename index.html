<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTunes Web-Studio</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: #1db954;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #b3b3b3;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #1db954;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1ed760;
        }
        .player-section {
            margin-top: 30px;
            border-top: 1px solid #333;
            padding-top: 20px;
            text-align: center;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MyTunes Creator</h1>
        
        <div class="form-group">
            <label for="songTitle">Song-Titel</label>
            <input type="text" id="songTitle" placeholder="Gib deinem Song einen Namen...">
        </div>

        <div class="form-group">
            <label for="musicStyle">Musikstil / Genre</label>
            <select id="musicStyle">
                <option value="pop">Pop</option>
                <option value="hiphop">Hip Hop / Rap</option>
                <option value="rock">Rock</option>
                <option value="electronic">Electronic / EDM</option>
                <option value="lofi">Lo-Fi Beats</option>
            </select>
        </div>

        <div class="form-group">
            <label for="songPrompt">Prompt / Liedtext-Idee für die KI</label>
            <textarea id="songPrompt" placeholder="Beschreibe den Vibe oder füge Textzeilen ein..."></textarea>
        </div>

        <button onclick="generateSong()">Song mit KI generieren</button>

        <div class="player-section">
            <h3>Dein erstellter Track</h3>
            <p id="currentTrackInfo">Noch kein Song generiert.</p>
            <!-- Platzhalter für einen Audio-Player (hier kannst du später generierte URLs einbinden) -->
            <audio id="audioPlayer" controls style="display: none;"></audio>
        </div>
    </div>

    <script>
        function generateSong() {
            const title = document.getElementById('songTitle').value || "Unbenannter Track";
            const style = document.getElementById('musicStyle').value;
            const prompt = document.getElementById('songPrompt').value;
            
            const infoText = document.getElementById('currentTrackInfo');
            const player = document.getElementById('audioPlayer');

            infoText.innerText = `Generiere "${title}" (${style})... Bitte warten.`;

            // Hier würde normalerweise die Verbindung zu einer KI-Musik-API (wie MusicAPI) stattfinden.
            // Für den Prototypen simulieren wir den Prozess mit einer kurzen Verzögerung:
            setTimeout(() => {
                infoText.innerText = `Fertig! Abspielen: "${title}"`;
                // Beispiel-Audio für die Demonstration (ersetze dies später durch die echte API-Antwort)
                player.src = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3";
                player.style.display = "block";
                player.play();
            }, 2000);
        }
    </script>

</body>
</html>
