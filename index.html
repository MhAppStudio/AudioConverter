<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AudioForge iOS Studio</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MP4Box.js for native iOS MOV/MP4 Audio Demuxing -->
  <script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ios: {
              bg: '#000000',
              card: '#1c1c1e',
              cardHover: '#2c2c2e',
              blue: '#0a84ff',
              green: '#30d158',
              red: '#ff453a',
              textMuted: '#8e8e93'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 24px;
      width: 24px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      cursor: pointer;
      margin-top: -10px;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: #3a3a3c;
      border-radius: 2px;
    }
    button, label {
      touch-action: manipulation;
    }
  </style>
</head>
<body class="min-h-screen pb-12 pt-4 px-4 flex flex-col items-center justify-start max-w-md mx-auto">

  <!-- Header -->
  <header class="w-full flex items-center justify-between mb-6 pt-2">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/30">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-2v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12 0c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-2"/>
        </svg>
      </div>
      <div>
        <h1 class="text-lg font-bold tracking-tight leading-tight">AudioForge iOS</h1>
        <p class="text-xs text-ios-textMuted">Video-zu-Audio Converter</p>
      </div>
    </div>
    <span class="text-[11px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-full flex items-center gap-1">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
      iOS Safe Engine
    </span>
  </header>

  <!-- Notification Banner -->
  <div id="error-banner" class="hidden w-full mb-4 p-3.5 bg-red-500/15 border border-red-500/30 rounded-2xl flex items-start gap-3">
    <div class="w-5 h-5 rounded-full bg-red-500 flex items-center justify-center text-white text-xs font-bold shrink-0 mt-0.5">!</div>
    <p id="error-message" class="text-xs text-red-200 leading-relaxed"></p>
  </div>

  <!-- Shared File Input -->
  <input type="file" id="file-input" accept="video/*" class="sr-only">

  <!-- Video Dropzone / Upload Container (LABEL for native iOS trigger) -->
  <label id="upload-box" for="file-input" class="w-full block bg-ios-card border-2 border-dashed border-gray-700 hover:border-ios-blue active:border-ios-blue rounded-3xl p-6 text-center cursor-pointer transition-all mb-5 relative group overflow-hidden">
    <div class="flex flex-col items-center justify-center py-4 pointer-events-none">
      <div class="w-14 h-14 rounded-full bg-ios-blue/10 flex items-center justify-center text-ios-blue mb-3 group-hover:scale-110 transition-transform">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
        </svg>
      </div>
      <p class="font-medium text-sm text-gray-200 mb-1">Hier tippen um Video auszuwählen</p>
      <p class="text-xs text-ios-textMuted">Unterstützt `.mov`, `.mp4` & `.m4v` aus der Mediathek</p>
    </div>
  </label>

  <!-- Video Preview Area -->
  <div id="preview-box" class="hidden w-full bg-ios-card rounded-3xl p-4 mb-5 shadow-xl border border-white/5">
    <div class="flex justify-between items-center mb-3">
      <span id="file-name" class="text-xs font-medium text-gray-300 truncate max-w-[200px]">video.mov</span>
      <label for="file-input" class="text-xs text-ios-blue font-semibold hover:underline cursor-pointer py-1 px-2 bg-ios-blue/10 rounded-lg">Anderes Video</label>
    </div>
    
    <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden mb-2">
      <video id="video-preview" playsinline controls class="w-full h-full object-contain"></video>
    </div>
  </div>

  <!-- Audio Controls Card -->
  <div class="w-full bg-ios-card rounded-3xl p-5 mb-5 shadow-xl border border-white/5">
    <div class="flex items-center gap-2 mb-4 pb-2 border-b border-white/5">
      <svg class="w-4 h-4 text-ios-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/>
      </svg>
      <h2 class="text-xs font-bold tracking-wider text-ios-textMuted uppercase">Audio-Einstellungen</h2>
    </div>

    <!-- Volume Booster Slider -->
    <div class="mb-5">
      <div class="flex justify-between text-xs font-medium mb-2">
        <span class="text-gray-300">Lautstärke-Verstärkung</span>
        <span id="volume-val" class="text-ios-blue font-bold">100%</span>
      </div>
      <input type="range" id="volume-slider" min="50" max="300" value="100" class="w-full accent-ios-blue">
    </div>

    <!-- Format Options -->
    <div class="mb-2">
      <label class="block text-xs font-medium text-gray-300 mb-2">Ausgabeformat</label>
      <div class="grid grid-cols-2 gap-2">
        <button id="format-wav" type="button" class="format-btn py-2.5 px-3 rounded-xl border border-ios-blue bg-ios-blue/20 text-ios-blue text-xs font-semibold text-center transition-all">
          WAV (Glasklar)
        </button>
        <button id="format-m4a" type="button" class="format-btn py-2.5 px-3 rounded-xl border border-gray-700 bg-ios-cardHover text-gray-400 text-xs font-semibold text-center transition-all">
          M4A / AAC (Komprimiert)
        </button>
      </div>
    </div>
  </div>

  <!-- Action Button -->
  <button id="convert-btn" type="button" disabled class="w-full py-4 rounded-2xl bg-ios-blue disabled:bg-gray-800 disabled:text-gray-500 text-white font-bold text-sm shadow-lg shadow-blue-500/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mb-4 cursor-pointer">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
    </svg>
    <span id="convert-btn-text">Jetzt Audio extrahieren</span>
  </button>

  <!-- Progress Bar Container -->
  <div id="progress-box" class="hidden w-full bg-ios-card rounded-2xl p-4 mb-4 border border-white/5">
    <div class="flex justify-between text-xs mb-2">
      <span id="progress-status" class="text-gray-300 font-medium">Verarbeite...</span>
      <span id="progress-percent" class="text-ios-blue font-bold">0%</span>
    </div>
    <div class="w-full h-2 bg-gray-800 rounded-full overflow-hidden">
      <div id="progress-bar" class="h-full bg-ios-blue w-0 transition-all duration-300"></div>
    </div>
  </div>

  <!-- Download & iOS Share Card -->
  <div id="result-box" class="hidden w-full bg-ios-card rounded-3xl p-5 shadow-2xl border border-emerald-500/30 text-center animate-fadeIn">
    <div class="w-12 h-12 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto mb-3">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
      </svg>
    </div>
    <h3 class="text-base font-bold text-white mb-1">Audio erfolgreich extrahiert!</h3>
    <p id="result-info" class="text-xs text-ios-textMuted mb-4">Bereit zum Download</p>

    <div class="flex flex-col gap-2.5">
      <button id="download-btn" type="button" class="w-full py-3.5 rounded-xl bg-emerald-500 text-black font-bold text-sm shadow-lg shadow-emerald-500/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2 cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        <span>Audio herunterladen</span>
      </button>

      <!-- iOS Share Button -->
      <button id="share-btn" type="button" class="w-full py-3 rounded-xl bg-ios-cardHover border border-white/10 text-ios-blue font-semibold text-xs active:scale-[0.98] transition-all flex items-center justify-center gap-2 cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684"/>
        </svg>
        <span>In Dateien speichern / Teilen</span>
      </button>
    </div>
  </div>

  <script>
    // State Variables
    let selectedFile = null;
    let selectedFormat = 'wav';
    let generatedBlob = null;
    let generatedFileName = '';

    // Elements
    const uploadBox = document.getElementById('upload-box');
    const fileInput = document.getElementById('file-input');
    const previewBox = document.getElementById('preview-box');
    const videoPreview = document.getElementById('video-preview');
    const fileNameDisplay = document.getElementById('file-name');
    const convertBtn = document.getElementById('convert-btn');
    const convertBtnText = document.getElementById('convert-btn-text');
    const volumeSlider = document.getElementById('volume-slider');
    const volumeVal = document.getElementById('volume-val');
    const formatWav = document.getElementById('format-wav');
    const formatM4a = document.getElementById('format-m4a');
    const errorBanner = document.getElementById('error-banner');
    const errorMessage = document.getElementById('error-message');
    const progressBox = document.getElementById('progress-box');
    const progressBar = document.getElementById('progress-bar');
    const progressPercent = document.getElementById('progress-percent');
    const progressStatus = document.getElementById('progress-status');
    const resultBox = document.getElementById('result-box');
    const resultInfo = document.getElementById('result-info');
    const downloadBtn = document.getElementById('download-btn');
    const shareBtn = document.getElementById('share-btn');

    // Handle File Selection
    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        handleFileSelect(e.target.files[0]);
      }
    });

    volumeSlider.addEventListener('input', (e) => {
      volumeVal.innerText = `${e.target.value}%`;
    });

    formatWav.addEventListener('click', () => setFormat('wav'));
    formatM4a.addEventListener('click', () => setFormat('m4a'));

    function setFormat(fmt) {
      selectedFormat = fmt;
      if (fmt === 'wav') {
        formatWav.className = "format-btn py-2.5 px-3 rounded-xl border border-ios-blue bg-ios-blue/20 text-ios-blue text-xs font-semibold text-center transition-all cursor-pointer";
        formatM4a.className = "format-btn py-2.5 px-3 rounded-xl border border-gray-700 bg-ios-cardHover text-gray-400 text-xs font-semibold text-center transition-all cursor-pointer";
      } else {
        formatM4a.className = "format-btn py-2.5 px-3 rounded-xl border border-ios-blue bg-ios-blue/20 text-ios-blue text-xs font-semibold text-center transition-all cursor-pointer";
        formatWav.className = "format-btn py-2.5 px-3 rounded-xl border border-gray-700 bg-ios-cardHover text-gray-400 text-xs font-semibold text-center transition-all cursor-pointer";
      }
    }

    function showError(msg) {
      errorMessage.innerText = msg;
      errorBanner.classList.remove('hidden');
    }

    function hideError() {
      errorBanner.classList.add('hidden');
    }

    function handleFileSelect(file) {
      hideError();
      resultBox.classList.add('hidden');
      progressBox.classList.add('hidden');
      selectedFile = file;

      fileNameDisplay.innerText = file.name;
      const url = URL.createObjectURL(file);
      videoPreview.src = url;

      uploadBox.classList.add('hidden');
      previewBox.classList.remove('hidden');
      convertBtn.disabled = false;
      convertBtnText.innerText = "Jetzt Audio extrahieren";
    }

    // Extraction Trigger
    convertBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      hideError();
      convertBtn.disabled = true;
      convertBtnText.innerText = "Verarbeite...";
      progressBox.classList.remove('hidden');
      resultBox.classList.add('hidden');
      updateProgress(10, 'Datei wird geladen...');

      try {
        let audioBuffer = null;

        // Stage 1: Try MP4Box Demuxer for iOS MOV/MP4 files
        try {
          updateProgress(30, 'Analysiere Video-Tonspur...');
          audioBuffer = await extractAudioWithMP4Box(selectedFile);
        } catch (mp4Err) {
          console.warn("MP4Box extraction failed, trying Web Audio API:", mp4Err);
        }

        // Stage 2: Fallback to Direct AudioContext Decoding
        if (!audioBuffer) {
          updateProgress(50, 'Dekodiere Audio-Daten...');
          audioBuffer = await extractAudioViaAudioContext(selectedFile);
        }

        if (!audioBuffer) {
          throw new Error("Das Video enthält keine lesbare Tonspur oder das Format wird von iOS nicht unterstützt.");
        }

        // Apply Volume Gain
        updateProgress(80, 'Verarbeite Audio & Lautstärke...');
        const gain = parseFloat(volumeSlider.value) / 100.0;
        if (gain !== 1.0) {
          for (let c = 0; c < audioBuffer.numberOfChannels; c++) {
            const data = audioBuffer.getChannelData(c);
            for (let i = 0; i < data.length; i++) {
              data[i] = Math.max(-1, Math.min(1, data[i] * gain));
            }
          }
        }

        // Encode to Output Format
        updateProgress(95, 'Erstelle Audiodatei...');
        const baseName = selectedFile.name.replace(/\.[^/.]+$/, "");
        
        generatedBlob = audioBufferToWavBlob(audioBuffer);
        generatedFileName = selectedFormat === 'wav' ? `${baseName}_audio.wav` : `${baseName}_audio.m4a`;

        updateProgress(100, 'Fertig!');
        setTimeout(() => {
          progressBox.classList.add('hidden');
          resultInfo.innerText = `${generatedFileName} (${(generatedBlob.size / (1024 * 1024)).toFixed(2)} MB)`;
          resultBox.classList.remove('hidden');
          convertBtn.disabled = false;
          convertBtnText.innerText = "Erneut extrahieren";
        }, 400);

      } catch (err) {
        console.error(err);
        showError(err.message || "Fehler beim Verarbeiten der Audiodatei.");
        progressBox.classList.add('hidden');
        convertBtn.disabled = false;
        convertBtnText.innerText = "Erneut versuchen";
      }
    });

    function updateProgress(percent, status) {
      progressBar.style.width = `${percent}%`;
      progressPercent.innerText = `${percent}%`;
      progressStatus.innerText = status;
    }

    // --- Engine Stage 1: MP4Box Demuxer for iOS MOV/MP4 ---
    function extractAudioWithMP4Box(file) {
      return new Promise((resolve, reject) => {
        const mp4boxfile = MP4Box.createFile();
        let audioTrack = null;
        let samples = [];
        const reader = new FileReader();

        mp4boxfile.onReady = (info) => {
          audioTrack = info.audioTracks && info.audioTracks[0];
          if (!audioTrack) {
            reject(new Error("Keine Audio-Spur im Video gefunden."));
            return;
          }
          mp4boxfile.setExtractionOptions(audioTrack.id, null, { nbSamples: 10000 });
          mp4boxfile.start();
        };

        mp4boxfile.onSamples = (id, user, sampleList) => {
          samples.push(...sampleList);
        };

        mp4boxfile.onError = (e) => reject(e);

        reader.onload = (e) => {
          const buffer = e.target.result;
          buffer.fileStart = 0;
          try {
            mp4boxfile.appendBuffer(buffer);
            mp4boxfile.flush();

            if (samples.length === 0) {
              reject(new Error("Keine Audio-Samples extrahiert."));
              return;
            }

            const adtsBuffer = createAdtsContainer(samples, audioTrack);
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            const audioCtx = new AudioCtx();
            
            if (audioCtx.state === 'suspended') {
              audioCtx.resume();
            }

            audioCtx.decodeAudioData(adtsBuffer, (decoded) => {
              resolve(decoded);
            }, (err) => reject(err));

          } catch (err) {
            reject(err);
          }
        };

        reader.readAsArrayBuffer(file);
      });
    }

    // Helper: Construct ADTS AAC headers for iOS AudioContext
    function createAdtsContainer(samples, track) {
      const sampleRates = [96000, 88200, 64000, 48000, 44100, 32000, 24000, 22050, 16000, 12000, 11025, 8000, 7350];
      const sampleRateIdx = sampleRates.indexOf(track.audio ? track.audio.sample_rate : 44100);
      const srIdx = sampleRateIdx !== -1 ? sampleRateIdx : 4;
      const channels = (track.audio && track.audio.channel_count) ? track.audio.channel_count : 2;

      let totalSize = 0;
      samples.forEach(s => totalSize += s.data.length + 7);

      const adtsBuf = new Uint8Array(totalSize);
      let offset = 0;

      samples.forEach(s => {
        const frameLen = s.data.length + 7;
        adtsBuf[offset] = 0xFF;
        adtsBuf[offset + 1] = 0xF1;
        adtsBuf[offset + 2] = (1 << 6) | (srIdx << 2) | (channels >> 2);
        adtsBuf[offset + 3] = ((channels & 3) << 6) | (frameLen >> 11);
        adtsBuf[offset + 4] = (frameLen >> 3) & 0xFF;
        adtsBuf[offset + 5] = ((frameLen & 7) << 5) | 0x1F;
        adtsBuf[offset + 6] = 0xFC;

        adtsBuf.set(s.data, offset + 7);
        offset += frameLen;
      });

      return adtsBuf.buffer;
    }

    // --- Engine Stage 2: Direct AudioContext Fallback ---
    function extractAudioViaAudioContext(file) {
      return new Promise((resolve, reject) => {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const reader = new FileReader();

        reader.onload = function (e) {
          audioCtx.decodeAudioData(e.target.result, 
            (buffer) => resolve(buffer),
            (err) => reject(new Error("Video-Tonspur konnte auf diesem Gerät nicht dekodiert werden."))
          );
        };
        reader.onerror = () => reject(new Error("Fehler beim Lesen der Datei."));
        reader.readAsArrayBuffer(file);
      });
    }

    // --- WAV Encoder ---
    function audioBufferToWavBlob(buffer) {
      const numOfChan = buffer.numberOfChannels;
      const length = buffer.length * numOfChan * 2 + 44;
      const out = new DataView(new ArrayBuffer(length));
      let channels = [], sample, offset = 0, pos = 0;

      function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
      function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

      setUint32(0x46464952); // "RIFF"
      setUint32(length - 8);
      setUint32(0x45564157); // "WAVE"
      setUint32(0x20746d66); // "fmt "
      setUint32(16);          // SubChunk1Size
      setUint16(1);           // AudioFormat (PCM)
      setUint16(numOfChan);
      setUint32(buffer.sampleRate);
      setUint32(buffer.sampleRate * 2 * numOfChan);
      setUint16(numOfChan * 2);
      setUint16(16);          // BitsPerSample
      setUint32(0x61746164); // "data"
      setUint32(length - pos - 4);

      for (let i = 0; i < buffer.numberOfChannels; i++) {
        channels.push(buffer.getChannelData(i));
      }

      while (offset < buffer.length) {
        for (let i = 0; i < numOfChan; i++) {
          sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
          out.setInt16(pos, sample, true);
          pos += 2;
        }
        offset++;
      }

      return new Blob([out], { type: selectedFormat === 'wav' ? "audio/wav" : "audio/aac" });
    }

    // Download Handler
    downloadBtn.addEventListener('click', () => {
      if (!generatedBlob) return;
      const url = URL.createObjectURL(generatedBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = generatedFileName;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 100);
    });

    // iOS Native Share Handler
    shareBtn.addEventListener('click', async () => {
      if (!generatedBlob) return;
      const file = new File([generatedBlob], generatedFileName, { type: generatedBlob.type });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: 'Extrahierte Audio-Datei',
            text: 'Hier ist deine extrahierte Audiodatei von AudioForge iOS.'
          });
        } catch (err) {
          if (err.name !== 'AbortError') {
            alert('Teilen nicht möglich: ' + err.message);
          }
        }
      } else {
        alert('Nutzen Sie den Download-Button oben, um die Datei direkt herunterzuladen.');
      }
    });
  </script>
</body>
</html>
